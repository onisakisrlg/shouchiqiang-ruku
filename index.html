    <style>
      /* Disable scroll bouncing on industrial pads */
      body, html {
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      /* Custom scrollbar for desktop view */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e5e5e5; 
      }
      ::-webkit-scrollbar-thumb {
        background: #888; 
        border-radius: 4px;
      }
    </style>
